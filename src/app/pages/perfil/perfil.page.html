<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Mi Perfil</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="perfil-container">

    <div class="avatar-section">
      <div class="avatar">{{ inicial }}</div>
      <h2 class="nombre">{{ nombre }}</h2>
      <p class="email">{{ email }}</p>
    </div>

    <div class="stats-section">
      <h4 class="section-title">Mis Reportes</h4>
      <div class="stats-grid">
        <div class="stat-card total">
          <span class="stat-number">{{ totalReportes }}</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-card recibido">
          <span class="stat-number">{{ reportesPorEstado.recibido }}</span>
          <span class="stat-label">Recibidos</span>
        </div>
        <div class="stat-card en-proceso">
          <span class="stat-number">{{ reportesPorEstado.en_proceso }}</span>
          <span class="stat-label">En proceso</span>
        </div>
        <div class="stat-card resuelto">
          <span class="stat-number">{{ reportesPorEstado.resuelto }}</span>
          <span class="stat-label">Resueltos</span>
        </div>
      </div>
    </div>

    <div class="info-section">
      <h4 class="section-title">Información</h4>

      <div class="info-card">
        <ion-icon name="person-outline"></ion-icon>
        <div class="info-content">
          <p class="info-label">Nombre</p>
          <div *ngIf="!editandoNombre" class="info-value-row">
            <p class="info-value">{{ nombre }}</p>
            <ion-button fill="clear" size="small" (click)="iniciarEdicion()">
              <ion-icon name="create-outline" slot="icon-only"></ion-icon>
            </ion-button>
          </div>
          <div *ngIf="editandoNombre" class="edit-row">
            <ion-input
              [(ngModel)]="nombreEditado"
              placeholder="Ingresa tu nombre"
              class="edit-input">
            </ion-input>
            <ion-button fill="clear" size="small" color="success" (click)="guardarNombre()">
              <ion-icon name="checkmark-outline" slot="icon-only"></ion-icon>
            </ion-button>
            <ion-button fill="clear" size="small" color="danger" (click)="cancelarEdicion()">
              <ion-icon name="close-outline" slot="icon-only"></ion-icon>
            </ion-button>
          </div>
        </div>
      </div>

      <div class="info-card">
        <ion-icon name="mail-outline"></ion-icon>
        <div>
          <p class="info-label">Correo</p>
          <p class="info-value">{{ email }}</p>
        </div>
      </div>

    </div>

  </div>

</ion-content>
